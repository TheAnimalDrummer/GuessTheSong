<!DOCTYPE html>
<html lang="de">
<head>
  <script src="songjs.js"></script>
  <meta charset="UTF-8">
  <title>Jeopardy Songs Erraten</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      margin: 0;
      padding: 10px;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
      font-size: 2em;
      color: #c0392b;
    }

    .input-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      flex-direction: column;
      text-align: center;
      margin-top: 10vh;
    }

    .input-area input {
      padding: 6px 10px;
      font-size: 16px;
      margin: 5px;
      width: 200px;
      text-align: center;
    }

    .input-area button {
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      background: #c0392b;
      border: none;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      background: #f0f0f0;
      padding: 10px 0;
      font-size: 16px;
    }

    .team-box {
      text-align: center;
      position: relative;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(11, 1fr);
      height: 70vh;
      margin-top: 10px;
      gap: 4px;
    }

    .category {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c0392b;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border: none;
      color: white;
      border-radius: 12px;
    }

    .button {
      width: 100%;
      height: 100%;
      background: #3498db;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      border-radius: 12px;
    }

    .button:hover:not(:disabled) {
      background: #5dade2;
      transform: scale(1.1);
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
    }

    .button:disabled {
      background: #d5d8dc;
      color: #888;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .current-turn {
      text-align: center;
      margin-top: 10px;
      font-size: 18px;
    }

    .control-buttons {
      text-align: center;
      margin-top: 10px;
    }

    .control-buttons button {
      padding: 8px 16px;
      margin: 0 5px;
      font-weight: bold;
      background: #2980b9;
      border: none;
      color: white;
      cursor: pointer;
    }

    .score-animation {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 30px;
      font-weight: bold;
      animation: pop 1s ease-out forwards;
    }

    @keyframes pop {
      0% { 
        opacity: 1; 
        top: -30px; 
      }
      100% { 
        opacity: 0; 
        top: -50px; 
      }
    }

    .winner {
      text-align: center;
      font-size: 24px;
      color: #27ae60;
      margin-top: 20px;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      border: 2px solid #ccc;
      padding: 20px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      display: none;
      text-align: center;
      z-index: 100;
    }

    .popup button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }

    .popup button:hover {
      background-color: #5dade2;
    }

    .team-selection {
      margin-top: 10px;
    }

    #notGuessedAnimation {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3em;
      font-weight: bold;
      color: #e74c3c;
      background-color: white;
      padding: 20px;
      border-radius: 15px;
      display: none;
      z-index: 1000;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .not-guessed-message {
      animation: shake 0.5s ease-in-out infinite;
    }

    @keyframes shake {
      0% { transform: translateX(-10px); }
      25% { transform: translateX(10px); }
      50% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }

    /* Invisible media style for YouTube or SoundCloud players */
    .invisible-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Style for the lyrics container */
    .lyrics-container {
      margin: 15px auto;
      padding: 20px;
      max-width: 90%;
      background: #f9f9f9;
      border-radius: 8px;
      /*box-shadow: 0 2px 8px rgba(0,0,0,0.2);*/
      text-align: left;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.5;
    }

    /* Updated style for the correct answer container */
    #correctAnswerDisplay {
      margin: 15px auto;
      padding: 10px;
      max-width: 90%;
      background: none;
      border: none;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: green;
      line-height: 1.5;
    }

    audio{
      display: none;
    }
  </style>
</head>
<body>

  <h1>🎵 Jeopardy Songs Erraten</h1>

  <div class="input-area" id="teamInputArea">
    <input type="text" placeholder="Team 1" id="team1">
    <input type="text" placeholder="Team 2" id="team2">
    <input type="text" placeholder="Team 3" id="team3">
    <input type="text" placeholder="Team 4" id="team4">
    <button onclick= "startGame()" >Spiel starten</button>
  </div>

  <div class="scoreboard hidden" id="scoreboard"></div>
  <div class="current-turn hidden" id="currentTeamDisplay"></div>
  <div class="control-buttons hidden" id="controls">
    <button onclick="nextTeam()">Nächstes Team</button>
  </div>
  <div class="grid hidden" id="board"></div>
  <div class="winner hidden" id="winnerDisplay"></div>

  <!-- Popup Fenster für Entscheidung und Frage-Inhalte -->
  <div class="popup" id="popup">
    <div id="questionContent">
      <!-- Dynamisch eingefügter YouTube-/SoundCloud-Player oder Lyrics erscheinen hier -->
    </div>
    <h3>Wurde der Song erraten?</h3>
    <div class="team-selection" id="teamButtonsContainer">
      <!-- Dynamisch erzeugte Team-Buttons -->
    </div>
    <!-- Reveal Answer Button and Container -->
    <button onclick="revealAnswer()">Antwort zeigen</button>
    <div id="correctAnswerDisplay" class="hidden">
      <p id="correctAnswerText"></p>
    </div>
    <button onclick="resetSelection()">Reset</button>
    <button id="pause-button" onclick="pauseGame()">Pause</button>
    <button onclick="showNotGuessedAnimation()">Nicht erraten</button>
  </div>

  <!-- Div für die "Nicht erraten"-Animation -->
  <div id="notGuessedAnimation" class="hidden">
    <div class="not-guessed-message">❌ Dieser Song wurde nicht erraten! ❌</div>
  </div>

</body>
</html>
